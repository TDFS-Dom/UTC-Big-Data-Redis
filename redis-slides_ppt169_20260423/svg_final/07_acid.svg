<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <filter id="shadow" x="-15%" y="-15%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10" /><feOffset dx="0" dy="4" result="offsetBlur" />
      <feFlood flood-color="#000000" flood-opacity="0.12" result="shadowColor" />
      <feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadow" />
      <feMerge><feMergeNode in="shadow" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="#FFFFFF" />
  <rect x="0" y="0" width="1280" height="6" fill="#0B4DA2" />
  <text x="60" y="55" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#0B4DA2">3.4 ACID Properties</text>
  <path fill="#D12B1F" d="M61.50,68 H118.50 A1.50,1.50 0 0 1 120,69.50 V69.50 A1.50,1.50 0 0 1 118.50,71 H61.50 A1.50,1.50 0 0 1 60,69.50 V69.50 A1.50,1.50 0 0 1 61.50,68 Z" />
  <text x="60" y="95" font-family="Arial, sans-serif" font-size="16" fill="#718096">Tập hợp các tính chất đảm bảo độ tin cậy của giao dịch trong CSDL</text>

  
  <g filter="url(#shadow)">
    <path fill="#FFFFFF" d="M72,120 H613 A12,12 0 0 1 625,132 V358 A12,12 0 0 1 613,370 H72 A12,12 0 0 1 60,358 V132 A12,12 0 0 1 72,120 Z" />
    <circle cx="115" cy="175" r="32" fill="#0B4DA2" />
    <text x="115" y="184" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF">A</text>
    <text x="165" y="170" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#0B4DA2">Atomicity</text>
    <text x="165" y="195" font-family="Arial, sans-serif" font-size="16" fill="#D12B1F">Tính nguyên tử</text>
    <rect x="90" y="215" width="510" height="2" fill="#E2E8F0" />
    <text x="90" y="250" font-family="Arial, sans-serif" font-size="17" fill="#2D3748">Tất cả thực hiện hoặc không gì cả</text>
    <text x="90" y="278" font-family="Arial, sans-serif" font-size="15" fill="#718096">Không có trạng thái trung gian.</text>
    <text x="90" y="303" font-family="Arial, sans-serif" font-size="15" fill="#718096">Thất bại → rollback toàn bộ.</text>
  </g>

  
  <g filter="url(#shadow)">
    <path fill="#FFFFFF" d="M667,120 H1208 A12,12 0 0 1 1220,132 V358 A12,12 0 0 1 1208,370 H667 A12,12 0 0 1 655,358 V132 A12,12 0 0 1 667,120 Z" />
    <circle cx="710" cy="175" r="32" fill="#D12B1F" />
    <text x="710" y="184" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF">C</text>
    <text x="760" y="170" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#D12B1F">Consistency</text>
    <text x="760" y="195" font-family="Arial, sans-serif" font-size="16" fill="#0B4DA2">Tính nhất quán</text>
    <rect x="685" y="215" width="510" height="2" fill="#E2E8F0" />
    <text x="685" y="250" font-family="Arial, sans-serif" font-size="17" fill="#2D3748">CSDL nhất quán trước và sau giao dịch</text>
    <text x="685" y="278" font-family="Arial, sans-serif" font-size="15" fill="#718096">Ràng buộc toàn vẹn luôn được duy trì.</text>
    <text x="685" y="303" font-family="Arial, sans-serif" font-size="15" fill="#718096">VD: Cập nhật float bằng varchar → từ chối.</text>
  </g>

  
  <g filter="url(#shadow)">
    <path fill="#FFFFFF" d="M72,400 H613 A12,12 0 0 1 625,412 V638 A12,12 0 0 1 613,650 H72 A12,12 0 0 1 60,638 V412 A12,12 0 0 1 72,400 Z" />
    <circle cx="115" cy="455" r="32" fill="#006AF9" />
    <text x="115" y="464" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF">I</text>
    <text x="165" y="450" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#006AF9">Isolation</text>
    <text x="165" y="475" font-family="Arial, sans-serif" font-size="16" fill="#2E7D32">Tính cô lập</text>
    <rect x="90" y="495" width="510" height="2" fill="#E2E8F0" />
    <text x="90" y="530" font-family="Arial, sans-serif" font-size="17" fill="#2D3748">Giao dịch đồng thời không ảnh hưởng nhau</text>
    <text x="90" y="558" font-family="Arial, sans-serif" font-size="15" fill="#718096">2 user cập nhật cùng bản ghi → cô lập.</text>
    <text x="90" y="583" font-family="Arial, sans-serif" font-size="15" fill="#718096">Không ghi đè lẫn nhau.</text>
  </g>

  
  <g filter="url(#shadow)">
    <path fill="#FFFFFF" d="M667,400 H1208 A12,12 0 0 1 1220,412 V638 A12,12 0 0 1 1208,650 H667 A12,12 0 0 1 655,638 V412 A12,12 0 0 1 667,400 Z" />
    <circle cx="710" cy="455" r="32" fill="#2E7D32" />
    <text x="710" y="464" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF">D</text>
    <text x="760" y="450" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#2E7D32">Durability</text>
    <text x="760" y="475" font-family="Arial, sans-serif" font-size="16" fill="#006AF9">Tính bền vững</text>
    <rect x="685" y="495" width="510" height="2" fill="#E2E8F0" />
    <text x="685" y="530" font-family="Arial, sans-serif" font-size="17" fill="#2D3748">Dữ liệu được lưu vĩnh viễn sau commit</text>
    <text x="685" y="558" font-family="Arial, sans-serif" font-size="15" fill="#718096">Dù hệ thống crash → dữ liệu vẫn bảo toàn.</text>
    <text x="685" y="583" font-family="Arial, sans-serif" font-size="15" fill="#718096">Ghi vào disk trước khi xác nhận.</text>
  </g>

  <text x="1220" y="700" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#A0AEC0">07 / 25</text>
</svg>