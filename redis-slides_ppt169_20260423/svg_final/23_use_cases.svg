    <text x="510" y="135" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">Rate Limiting</text>
  </g>
  <text x="485" y="190" font-family="Arial, sans-serif" font-size="15" fill="#2D3748">Giới hạn request API</text>
  <text x="485" y="215" font-family="Arial, sans-serif" font-size="14" fill="#718096">Max 100 req/phút mỗi user</text>
  <path fill="#1E293B" d="M493,240 H787 A8,8 0 0 1 795,248 V332 A8,8 0 0 1 787,340 H493 A8,8 0 0 1 485,332 V248 A8,8 0 0 1 493,240 Z" />
  <text x="500" y="268" font-family="Consolas, monospace" font-size="12" fill="#E2E8F0">INCR rate:user1</text>
  <text x="500" y="288" font-family="Consolas, monospace" font-size="12" fill="#E2E8F0">EXPIRE rate:user1 60</text>
  <text x="500" y="318" font-family="Consolas, monospace" font-size="12" fill="#718096"># Nếu GET &gt; 100 → reject</text>

  
  <g filter="url(#shadow)">
    <path fill="#FFFFFF" d="M862,100 H1208 A12,12 0 0 1 1220,112 V618 A12,12 0 0 1 1208,630 H862 A12,12 0 0 1 850,618 V112 A12,12 0 0 1 862,100 Z" />
