  <g transform="translate(80.0, 115.0) scale(1.5)" fill="#FFFFFF">
    <path fill-rule="evenodd" clip-rule="evenodd" d="M4 6V4C4 1.79086 5.79086 0 8 0C10.2091 0 12 1.79086 12 4V6H14V16H2V6H4ZM6 4C6 2.89543 6.89543 2 8 2C9.10457 2 10 2.89543 10 4V6H6V4ZM7 13V9H9V13H7Z" />
  </g>
    <text x="115" y="135" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">Session Store</text>
  </g>
  <text x="90" y="190" font-family="Arial, sans-serif" font-size="15" fill="#2D3748">Lưu session khi user đăng nhập</text>
  <text x="90" y="215" font-family="Arial, sans-serif" font-size="14" fill="#718096">Tự động hết hạn sau 30 phút</text>
  <path fill="#1E293B" d="M98,240 H392 A8,8 0 0 1 400,248 V352 A8,8 0 0 1 392,360 H98 A8,8 0 0 1 90,352 V248 A8,8 0 0 1 98,240 Z" />
  <text x="105" y="268" font-family="Consolas, monospace" font-size="12" fill="#E2E8F0">SET session:abc123</text>
  <text x="115" y="288" font-family="Consolas, monospace" font-size="12" fill="#FF6B35">'{"user_id":1,</text>
  <text x="120" y="308" font-family="Consolas, monospace" font-size="12" fill="#FF6B35">"name":"Admin"}'</text>
  <text x="115" y="328" font-family="Consolas, monospace" font-size="12" fill="#E2E8F0">EX 1800</text>
  <text x="105" y="348" font-family="Consolas, monospace" font-size="12" fill="#2E7D32">OK</text>

  
  <g filter="url(#shadow)">
    <path fill="#FFFFFF" d="M467,100 H813 A12,12 0 0 1 825,112 V618 A12,12 0 0 1 813,630 H467 A12,12 0 0 1 455,618 V112 A12,12 0 0 1 467,100 Z" />
