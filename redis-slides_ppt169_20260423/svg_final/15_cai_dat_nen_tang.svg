    <text x="640" y="132" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">macOS</text>
    <path fill="#1E293B" d="M493,170 H787 A8,8 0 0 1 795,178 V302 A8,8 0 0 1 787,310 H493 A8,8 0 0 1 485,302 V178 A8,8 0 0 1 493,170 Z" />
    <text x="500" y="195" font-family="Consolas, monospace" font-size="13" fill="#2E7D32"># Homebrew</text>
    <text x="500" y="215" font-family="Consolas, monospace" font-size="13" fill="#E2E8F0">brew install redis</text>
    <text x="500" y="245" font-family="Consolas, monospace" font-size="13" fill="#2E7D32"># Khởi động</text>
    <text x="500" y="265" font-family="Consolas, monospace" font-size="13" fill="#E2E8F0">brew services \</text>
    <text x="520" y="285" font-family="Consolas, monospace" font-size="13" fill="#E2E8F0">start redis</text>
  </g>

  
  <g filter="url(#shadow)">
