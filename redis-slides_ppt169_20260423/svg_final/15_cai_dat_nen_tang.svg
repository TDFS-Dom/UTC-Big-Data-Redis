<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs><filter id="shadow" x="-15%" y="-15%" width="140%" height="140%"><feGaussianBlur in="SourceAlpha" stdDeviation="10" /><feOffset dx="0" dy="4" result="offsetBlur" /><feFlood flood-color="#000000" flood-opacity="0.12" result="shadowColor" /><feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadow" /><feMerge><feMergeNode in="shadow" /><feMergeNode in="SourceGraphic" /></feMerge></filter></defs>
  <rect width="1280" height="720" fill="#FFFFFF" /><rect x="0" y="0" width="1280" height="6" fill="#0B4DA2" />
  <text x="60" y="55" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#0B4DA2">Cài đặt Redis — Các nền tảng</text>
  <path fill="#D12B1F" d="M61.50,68 H118.50 A1.50,1.50 0 0 1 120,69.50 V69.50 A1.50,1.50 0 0 1 118.50,71 H61.50 A1.50,1.50 0 0 1 60,69.50 V69.50 A1.50,1.50 0 0 1 61.50,68 Z" />

  
  <g filter="url(#shadow)">
    <path fill="#FFFFFF" d="M72,100 H418 A12,12 0 0 1 430,112 V618 A12,12 0 0 1 418,630 H72 A12,12 0 0 1 60,618 V112 A12,12 0 0 1 72,100 Z" />
    <path fill="#006AF9" d="M72,100 H418 A12,12 0 0 1 430,112 V138 A12,12 0 0 1 418,150 H72 A12,12 0 0 1 60,138 V112 A12,12 0 0 1 72,100 Z" /><rect x="60" y="138" width="370" height="12" fill="#006AF9" />
    <text x="245" y="132" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">WSL2 (Windows)</text>
    <path fill="#1E293B" d="M98,170 H392 A8,8 0 0 1 400,178 V362 A8,8 0 0 1 392,370 H98 A8,8 0 0 1 90,362 V178 A8,8 0 0 1 98,170 Z" />
    <text x="105" y="195" font-family="Consolas, monospace" font-size="13" fill="#2E7D32"># Bật WSL2</text>
    <text x="105" y="215" font-family="Consolas, monospace" font-size="13" fill="#E2E8F0">wsl --install</text>
    <text x="105" y="245" font-family="Consolas, monospace" font-size="13" fill="#2E7D32"># Cài Redis</text>
    <text x="105" y="265" font-family="Consolas, monospace" font-size="13" fill="#E2E8F0">sudo apt update</text>
    <text x="105" y="285" font-family="Consolas, monospace" font-size="13" fill="#E2E8F0">sudo apt install \</text>
    <text x="125" y="305" font-family="Consolas, monospace" font-size="13" fill="#E2E8F0">redis-server -y</text>
    <text x="105" y="335" font-family="Consolas, monospace" font-size="13" fill="#2E7D32"># Khởi động</text>
    <text x="105" y="355" font-family="Consolas, monospace" font-size="13" fill="#E2E8F0">sudo service \</text>
    <text x="125" y="365" font-family="Consolas, monospace" font-size="13" fill="#E2E8F0">redis-server start</text>
  </g>

  
  <g filter="url(#shadow)">
    <path fill="#FFFFFF" d="M467,100 H813 A12,12 0 0 1 825,112 V618 A12,12 0 0 1 813,630 H467 A12,12 0 0 1 455,618 V112 A12,12 0 0 1 467,100 Z" />
