    <path fill="#1E293B" d="M888,170 H1182 A8,8 0 0 1 1190,178 V362 A8,8 0 0 1 1182,370 H888 A8,8 0 0 1 880,362 V178 A8,8 0 0 1 888,170 Z" />
    <text x="895" y="195" font-family="Consolas, monospace" font-size="13" fill="#E2E8F0">sudo apt update</text>
    <text x="895" y="215" font-family="Consolas, monospace" font-size="13" fill="#E2E8F0">sudo apt install \</text>
    <text x="915" y="235" font-family="Consolas, monospace" font-size="13" fill="#E2E8F0">redis-server -y</text>
    <text x="895" y="265" font-family="Consolas, monospace" font-size="13" fill="#2E7D32"># Khởi động</text>
    <text x="895" y="285" font-family="Consolas, monospace" font-size="13" fill="#E2E8F0">sudo systemctl \</text>
    <text x="915" y="305" font-family="Consolas, monospace" font-size="13" fill="#E2E8F0">start redis-server</text>
    <text x="895" y="335" font-family="Consolas, monospace" font-size="13" fill="#E2E8F0">sudo systemctl \</text>
    <text x="915" y="355" font-family="Consolas, monospace" font-size="13" fill="#E2E8F0">enable redis-server</text>
  </g>

