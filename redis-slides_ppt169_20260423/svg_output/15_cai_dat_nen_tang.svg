<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs><filter id="shadow" x="-15%" y="-15%" width="140%" height="140%"><feGaussianBlur in="SourceAlpha" stdDeviation="10"/><feOffset dx="0" dy="4" result="offsetBlur"/><feFlood flood-color="#000000" flood-opacity="0.12" result="shadowColor"/><feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadow"/><feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <rect width="1280" height="720" fill="#FFFFFF"/><rect x="0" y="0" width="1280" height="6" fill="#0B4DA2"/>
  <text x="60" y="55" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#0B4DA2">Cài đặt Redis — Các nền tảng</text>
  <rect x="60" y="68" width="60" height="3" rx="1.5" fill="#D12B1F"/>

  <!-- WSL2 -->
  <g filter="url(#shadow)">
    <rect x="60" y="100" width="370" height="530" rx="12" fill="#FFFFFF"/>
    <rect x="60" y="100" width="370" height="50" rx="12" fill="#006AF9"/><rect x="60" y="138" width="370" height="12" fill="#006AF9"/>
    <text x="245" y="132" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">WSL2 (Windows)</text>
    <rect x="90" y="170" width="310" height="200" rx="8" fill="#1E293B"/>
    <text x="105" y="195" font-family="Consolas, monospace" font-size="13" fill="#2E7D32"># Bật WSL2</text>
    <text x="105" y="215" font-family="Consolas, monospace" font-size="13" fill="#E2E8F0">wsl --install</text>
    <text x="105" y="245" font-family="Consolas, monospace" font-size="13" fill="#2E7D32"># Cài Redis</text>
    <text x="105" y="265" font-family="Consolas, monospace" font-size="13" fill="#E2E8F0">sudo apt update</text>
    <text x="105" y="285" font-family="Consolas, monospace" font-size="13" fill="#E2E8F0">sudo apt install \</text>
    <text x="125" y="305" font-family="Consolas, monospace" font-size="13" fill="#E2E8F0">redis-server -y</text>
    <text x="105" y="335" font-family="Consolas, monospace" font-size="13" fill="#2E7D32"># Khởi động</text>
    <text x="105" y="355" font-family="Consolas, monospace" font-size="13" fill="#E2E8F0">sudo service \</text>
    <text x="125" y="365" font-family="Consolas, monospace" font-size="13" fill="#E2E8F0">redis-server start</text>
  </g>

  <!-- macOS -->
  <g filter="url(#shadow)">
    <rect x="455" y="100" width="370" height="530" rx="12" fill="#FFFFFF"/>
    <rect x="455" y="100" width="370" height="50" rx="12" fill="#2E7D32"/><rect x="455" y="138" width="370" height="12" fill="#2E7D32"/>
    <text x="640" y="132" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">macOS</text>
    <rect x="485" y="170" width="310" height="140" rx="8" fill="#1E293B"/>
    <text x="500" y="195" font-family="Consolas, monospace" font-size="13" fill="#2E7D32"># Homebrew</text>
    <text x="500" y="215" font-family="Consolas, monospace" font-size="13" fill="#E2E8F0">brew install redis</text>
    <text x="500" y="245" font-family="Consolas, monospace" font-size="13" fill="#2E7D32"># Khởi động</text>
    <text x="500" y="265" font-family="Consolas, monospace" font-size="13" fill="#E2E8F0">brew services \</text>
    <text x="520" y="285" font-family="Consolas, monospace" font-size="13" fill="#E2E8F0">start redis</text>
  </g>

  <!-- Linux -->
  <g filter="url(#shadow)">
    <rect x="850" y="100" width="370" height="530" rx="12" fill="#FFFFFF"/>
    <rect x="850" y="100" width="370" height="50" rx="12" fill="#D12B1F"/><rect x="850" y="138" width="370" height="12" fill="#D12B1F"/>
    <text x="1035" y="132" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">Linux (Ubuntu)</text>
    <rect x="880" y="170" width="310" height="200" rx="8" fill="#1E293B"/>
    <text x="895" y="195" font-family="Consolas, monospace" font-size="13" fill="#E2E8F0">sudo apt update</text>
    <text x="895" y="215" font-family="Consolas, monospace" font-size="13" fill="#E2E8F0">sudo apt install \</text>
    <text x="915" y="235" font-family="Consolas, monospace" font-size="13" fill="#E2E8F0">redis-server -y</text>
    <text x="895" y="265" font-family="Consolas, monospace" font-size="13" fill="#2E7D32"># Khởi động</text>
    <text x="895" y="285" font-family="Consolas, monospace" font-size="13" fill="#E2E8F0">sudo systemctl \</text>
    <text x="915" y="305" font-family="Consolas, monospace" font-size="13" fill="#E2E8F0">start redis-server</text>
    <text x="895" y="335" font-family="Consolas, monospace" font-size="13" fill="#E2E8F0">sudo systemctl \</text>
    <text x="915" y="355" font-family="Consolas, monospace" font-size="13" fill="#E2E8F0">enable redis-server</text>
  </g>

  <text x="1220" y="700" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#A0AEC0">15 / 25</text>
</svg>