<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs><filter id="shadow" x="-15%" y="-15%" width="140%" height="140%"><feGaussianBlur in="SourceAlpha" stdDeviation="10"/><feOffset dx="0" dy="4" result="offsetBlur"/><feFlood flood-color="#000000" flood-opacity="0.12" result="shadowColor"/><feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadow"/><feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <rect width="1280" height="720" fill="#FFFFFF"/><rect x="0" y="0" width="1280" height="6" fill="#0B4DA2"/>
  <text x="60" y="55" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#0B4DA2">3.7.3 Các loại NoSQL Database</text>
  <rect x="60" y="68" width="60" height="3" rx="1.5" fill="#D12B1F"/>

  <!-- Card 1: Key-Value -->
  <g filter="url(#shadow)">
    <rect x="60" y="100" width="565" height="260" rx="12" fill="#FFFFFF"/>
    <rect x="60" y="100" width="565" height="6" rx="3" fill="#D12B1F"/>
    <circle cx="115" cy="160" r="30" fill="#D12B1F" fill-opacity="0.1"/>
    <use data-icon="chunk/key" x="99" y="144" width="32" height="32" fill="#D12B1F"/>
    <text x="160" y="155" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#D12B1F">Key-Value Store</text>
    <text x="160" y="178" font-family="Arial, sans-serif" font-size="13" fill="#D12B1F" font-weight="bold">Redis thuộc loại này</text>
    <rect x="90" y="200" width="510" height="2" fill="#E2E8F0"/>
    <text x="90" y="230" font-family="Arial, sans-serif" font-size="15" fill="#2D3748">Đơn giản nhất, hiệu quả nhất. Dữ liệu = Key → Value.</text>
    <text x="90" y="255" font-family="Arial, sans-serif" font-size="14" fill="#718096">VD: Redis, DynamoDB, Riak, Memcached</text>
    <text x="90" y="280" font-family="Arial, sans-serif" font-size="14" fill="#718096">Ứng dụng: Cache, Session, Shopping Cart</text>
    <rect x="90" y="310" width="80" height="26" rx="13" fill="#D12B1F" fill-opacity="0.1"/>
    <text x="130" y="328" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#D12B1F">Redis</text>
  </g>

  <!-- Card 2: Column-Store -->
  <g filter="url(#shadow)">
    <rect x="655" y="100" width="565" height="260" rx="12" fill="#FFFFFF"/>
    <rect x="655" y="100" width="565" height="6" rx="3" fill="#0B4DA2"/>
    <circle cx="710" cy="160" r="30" fill="#0B4DA2" fill-opacity="0.1"/>
    <use data-icon="chunk/table" x="694" y="144" width="32" height="32" fill="#0B4DA2"/>
    <text x="755" y="155" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#0B4DA2">Column-Store</text>
    <text x="755" y="178" font-family="Arial, sans-serif" font-size="13" fill="#006AF9">Lưu trữ theo cột</text>
    <rect x="685" y="200" width="510" height="2" fill="#E2E8F0"/>
    <text x="685" y="230" font-family="Arial, sans-serif" font-size="15" fill="#2D3748">Lưu dữ liệu theo cột thay vì hàng. Phù hợp OLAP.</text>
    <text x="685" y="255" font-family="Arial, sans-serif" font-size="14" fill="#718096">VD: Cassandra, HBase, Google BigTable</text>
    <text x="685" y="280" font-family="Arial, sans-serif" font-size="14" fill="#718096">Ứng dụng: Phân tích dữ liệu lớn, Data Warehouse</text>
  </g>

  <!-- Card 3: Document -->
  <g filter="url(#shadow)">
    <rect x="60" y="390" width="565" height="260" rx="12" fill="#FFFFFF"/>
    <rect x="60" y="390" width="565" height="6" rx="3" fill="#006AF9"/>
    <circle cx="115" cy="450" r="30" fill="#006AF9" fill-opacity="0.1"/>
    <use data-icon="chunk/code" x="99" y="434" width="32" height="32" fill="#006AF9"/>
    <text x="160" y="445" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#006AF9">Document Database</text>
    <text x="160" y="468" font-family="Arial, sans-serif" font-size="13" fill="#0B4DA2">Lưu trữ document</text>
    <rect x="90" y="490" width="510" height="2" fill="#E2E8F0"/>
    <text x="90" y="520" font-family="Arial, sans-serif" font-size="15" fill="#2D3748">Lưu dữ liệu dạng JSON, XML, YAML. Truy vấn linh hoạt.</text>
    <text x="90" y="545" font-family="Arial, sans-serif" font-size="14" fill="#718096">VD: MongoDB, CouchDB, Microsoft DocumentDB</text>
    <text x="90" y="570" font-family="Arial, sans-serif" font-size="14" fill="#718096">Ứng dụng: CMS, E-commerce, Mobile apps</text>
  </g>

  <!-- Card 4: Graph -->
  <g filter="url(#shadow)">
    <rect x="655" y="390" width="565" height="260" rx="12" fill="#FFFFFF"/>
    <rect x="655" y="390" width="565" height="6" rx="3" fill="#2E7D32"/>
    <circle cx="710" cy="450" r="30" fill="#2E7D32" fill-opacity="0.1"/>
    <use data-icon="chunk/globe" x="694" y="434" width="32" height="32" fill="#2E7D32"/>
    <text x="755" y="445" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2E7D32">Graph Database</text>
    <text x="755" y="468" font-family="Arial, sans-serif" font-size="13" fill="#006AF9">Cơ sở dữ liệu đồ thị</text>
    <rect x="685" y="490" width="510" height="2" fill="#E2E8F0"/>
    <text x="685" y="520" font-family="Arial, sans-serif" font-size="15" fill="#2D3748">Lưu Node (thực thể) và Edge (quan hệ).</text>
    <text x="685" y="545" font-family="Arial, sans-serif" font-size="14" fill="#718096">VD: Neo4J, InfiniteGraph, OrientDB</text>
    <text x="685" y="570" font-family="Arial, sans-serif" font-size="14" fill="#718096">Ứng dụng: Mạng xã hội, Recommendation</text>
  </g>

  <text x="1220" y="700" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#A0AEC0">12 / 25</text>
</svg>