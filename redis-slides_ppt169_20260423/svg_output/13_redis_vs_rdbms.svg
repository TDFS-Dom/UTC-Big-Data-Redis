  <text x="140" y="200" font-family="Arial, sans-serif" font-size="17" fill="#2D3748">Caching dữ liệu</text></g>
  <g><circle cx="110" cy="245" r="16" fill="#2E7D32" fill-opacity="0.1"/><text x="110" y="250" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#2E7D32">✓</text>
  <text x="140" y="250" font-family="Arial, sans-serif" font-size="17" fill="#2D3748">Session management</text></g>
