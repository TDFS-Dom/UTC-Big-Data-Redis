  <text x="740" y="350" font-family="Arial, sans-serif" font-size="17" fill="#2D3748">Schema chặt chẽ, kiểm toán</text></g>
  <g><circle cx="710" cy="395" r="16" fill="#0B4DA2" fill-opacity="0.1"/><text x="710" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#0B4DA2">✓</text>
  <text x="740" y="400" font-family="Arial, sans-serif" font-size="17" fill="#2D3748">Nhất quán tuyệt đối</text></g>

  <!-- VS -->
  <circle cx="640" cy="380" r="28" fill="#FF6B35"/><text x="640" y="388" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF">VS</text>

