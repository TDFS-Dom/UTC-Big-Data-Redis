  <text x="740" y="250" font-family="Arial, sans-serif" font-size="17" fill="#2D3748">Dữ liệu quan hệ phức tạp</text></g>
  <g><circle cx="710" cy="295" r="16" fill="#0B4DA2" fill-opacity="0.1"/><text x="710" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#0B4DA2">✓</text>
  <text x="740" y="300" font-family="Arial, sans-serif" font-size="17" fill="#2D3748">Báo cáo phức tạp với JOIN</text></g>
