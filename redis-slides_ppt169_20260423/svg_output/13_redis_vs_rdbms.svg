  <text x="140" y="300" font-family="Arial, sans-serif" font-size="17" fill="#2D3748">Real-time analytics</text></g>
  <g><circle cx="110" cy="345" r="16" fill="#2E7D32" fill-opacity="0.1"/><text x="110" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#2E7D32">✓</text>
  <text x="140" y="350" font-family="Arial, sans-serif" font-size="17" fill="#2D3748">Message Queue / Pub-Sub</text></g>
