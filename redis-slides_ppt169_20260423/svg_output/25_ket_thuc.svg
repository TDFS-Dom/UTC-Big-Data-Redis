<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="coverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B4DA2"/><stop offset="100%" stop-color="#071F4A"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#coverGrad)"/>
  <circle cx="1100" cy="150" r="200" fill="#006AF9" fill-opacity="0.08"/>
  <circle cx="180" cy="600" r="160" fill="#D12B1F" fill-opacity="0.06"/>

  <text x="640" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="40" font-weight="bold" fill="#FFFFFF">Câu hỏi ôn tập</text>
  <rect x="560" y="165" width="160" height="3" rx="1.5" fill="#D12B1F"/>

  <rect x="200" y="200" width="880" height="310" rx="16" fill="#FFFFFF" fill-opacity="0.08"/>
  <text x="260" y="245" font-family="Arial, sans-serif" font-size="18" fill="#FFFFFF" fill-opacity="0.9">1. NoSQL database là gì? Kể tên 4 loại NoSQL database.</text>
  <text x="260" y="285" font-family="Arial, sans-serif" font-size="18" fill="#FFFFFF" fill-opacity="0.9">2. Redis thuộc loại NoSQL nào? Thuộc nhóm nào trong CAP?</text>
  <text x="260" y="325" font-family="Arial, sans-serif" font-size="18" fill="#FFFFFF" fill-opacity="0.9">3. Trình bày 3 tính chất của CAP Theorem.</text>
  <text x="260" y="365" font-family="Arial, sans-serif" font-size="18" fill="#FFFFFF" fill-opacity="0.9">4. So sánh ACID và BASE. Cho ví dụ.</text>
  <text x="260" y="405" font-family="Arial, sans-serif" font-size="18" fill="#FFFFFF" fill-opacity="0.9">5. Kể tên 5 kiểu dữ liệu trong Redis và ứng dụng.</text>
  <text x="260" y="445" font-family="Arial, sans-serif" font-size="18" fill="#FFFFFF" fill-opacity="0.9">6. Khi nào nên dùng Redis thay vì RDBMS? Cho 3 ví dụ.</text>
  <text x="260" y="485" font-family="Arial, sans-serif" font-size="18" fill="#FFFFFF" fill-opacity="0.9">7. Viết lệnh Redis tạo bảng xếp hạng sinh viên.</text>

  <text x="640" y="570" text-anchor="middle" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#FFFFFF">Cảm ơn!</text>
  <text x="640" y="610" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#FFFFFF" fill-opacity="0.6">Q &amp; A</text>

  <text x="640" y="690" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#FFFFFF" fill-opacity="0.4">ĐH Giao thông Vận tải (UTC) — Cao học Big Data — 2026</text>
</svg>