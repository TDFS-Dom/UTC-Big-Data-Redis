<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="coverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B4DA2"/>
      <stop offset="60%" stop-color="#093D82"/>
      <stop offset="100%" stop-color="#071F4A"/>
    </linearGradient>
    <linearGradient id="redAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D12B1F"/>
      <stop offset="100%" stop-color="#FF6B35"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" result="blur"/>
      <feFlood flood-color="#006AF9" flood-opacity="0.3" result="glowColor"/>
      <feComposite in="glowColor" in2="blur" operator="in" result="glow"/>
      <feMerge><feMergeNode in="glow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Nền gradient xanh đậm -->
  <rect width="1280" height="720" fill="url(#coverGrad)"/>

  <!-- Vòng tròn trang trí -->
  <circle cx="1100" cy="150" r="200" fill="#006AF9" fill-opacity="0.08"/>
  <circle cx="1150" cy="200" r="120" fill="#006AF9" fill-opacity="0.06"/>
  <circle cx="180" cy="600" r="160" fill="#D12B1F" fill-opacity="0.06"/>

  <!-- Đường kẻ trang trí -->
  <rect x="60" y="280" width="80" height="4" rx="2" fill="url(#redAccent)"/>

  <!-- Tiêu đề chính -->
  <text x="60" y="340" font-family="Arial, sans-serif" font-size="56" font-weight="bold" fill="#FFFFFF" filter="url(#glow)">REDIS</text>
  <text x="280" y="340" font-family="Arial, sans-serif" font-size="56" font-weight="bold" fill="#FFFFFF">&amp; NoSQL Database</text>

  <!-- Phụ đề -->
  <text x="60" y="390" font-family="Arial, sans-serif" font-size="24" fill="#FFFFFF" fill-opacity="0.8">Chương 3 — Lý thuyết &amp; Thực hành</text>

  <!-- Thanh đỏ Redis -->
  <rect x="60" y="420" width="500" height="3" rx="1.5" fill="url(#redAccent)" fill-opacity="0.6"/>

  <!-- Thông tin -->
  <text x="60" y="480" font-family="Arial, sans-serif" font-size="18" fill="#FFFFFF" fill-opacity="0.7">Đại học Giao thông Vận tải (UTC)</text>
  <text x="60" y="510" font-family="Arial, sans-serif" font-size="18" fill="#FFFFFF" fill-opacity="0.7">Cao học Big Data — 2026</text>

  <!-- Redis logo stylized -->
  <g>
    <rect x="920" y="350" width="260" height="130" rx="16" fill="#D12B1F" fill-opacity="0.15"/>
    <rect x="920" y="350" width="260" height="130" rx="16" fill="none" stroke="#D12B1F" stroke-width="1.5" stroke-opacity="0.4"/>
    <use data-icon="chunk/database" x="976" y="380" width="48" height="48" fill="#D12B1F"/>
    <text x="1040" y="415" font-family="Consolas, monospace" font-size="20" font-weight="bold" fill="#D12B1F">RE</text>
    <text x="1074" y="415" font-family="Consolas, monospace" font-size="20" font-weight="bold" fill="#FFFFFF">mote</text>
    <text x="1040" y="440" font-family="Consolas, monospace" font-size="20" font-weight="bold" fill="#D12B1F">DI</text>
    <text x="1068" y="440" font-family="Consolas, monospace" font-size="20" font-weight="bold" fill="#FFFFFF">ctionary</text>
    <text x="1040" y="465" font-family="Consolas, monospace" font-size="20" font-weight="bold" fill="#D12B1F">S</text>
    <text x="1054" y="465" font-family="Consolas, monospace" font-size="20" font-weight="bold" fill="#FFFFFF">erver</text>
  </g>

  <!-- Footer -->
  <text x="640" y="690" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#FFFFFF" fill-opacity="0.4">Môn: Lưu trữ và Xử lý dữ liệu lớn</text>
</svg>