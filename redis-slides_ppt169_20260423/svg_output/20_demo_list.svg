<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <rect width="1280" height="720" fill="#FFFFFF"/><rect x="0" y="0" width="1280" height="6" fill="#D12B1F"/>
  <text x="60" y="55" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#D12B1F">Demo: List — LPUSH, RPUSH, LPOP</text>
  <rect x="60" y="68" width="60" height="3" rx="1.5" fill="#0B4DA2"/>

  <rect x="60" y="95" width="560" height="300" rx="10" fill="#1E293B"/>
  <text x="80" y="120" font-family="Consolas, monospace" font-size="14" fill="#718096"># Thêm phần tử vào danh sách</text>
  <text x="80" y="142" font-family="Consolas, monospace" font-size="14" fill="#E2E8F0">LPUSH tasks "Task 3"</text>
  <text x="80" y="162" font-family="Consolas, monospace" font-size="14" fill="#E2E8F0">LPUSH tasks "Task 2"</text>
  <text x="80" y="182" font-family="Consolas, monospace" font-size="14" fill="#E2E8F0">LPUSH tasks "Task 1"</text>
  <text x="80" y="212" font-family="Consolas, monospace" font-size="14" fill="#E2E8F0">LRANGE tasks 0 -1</text>
  <text x="80" y="234" font-family="Consolas, monospace" font-size="14" fill="#2E7D32">1) "Task 1"</text>
  <text x="80" y="254" font-family="Consolas, monospace" font-size="14" fill="#2E7D32">2) "Task 2"</text>
  <text x="80" y="274" font-family="Consolas, monospace" font-size="14" fill="#2E7D32">3) "Task 3"</text>
  <text x="80" y="304" font-family="Consolas, monospace" font-size="14" fill="#E2E8F0">RPUSH tasks "Task 4"</text>
  <text x="80" y="326" font-family="Consolas, monospace" font-size="14" fill="#E2E8F0">LPOP tasks  <tspan fill="#2E7D32">"Task 1"</tspan></text>
  <text x="80" y="348" font-family="Consolas, monospace" font-size="14" fill="#E2E8F0">RPOP tasks  <tspan fill="#2E7D32">"Task 4"</tspan></text>
  <text x="80" y="370" font-family="Consolas, monospace" font-size="14" fill="#E2E8F0">LLEN tasks  <tspan fill="#FF6B35">(integer) 2</tspan></text>

  <!-- Message Queue example -->
  <text x="660" y="110" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#0B4DA2">Ứng dụng: Message Queue (FIFO)</text>
  <rect x="660" y="125" width="560" height="180" rx="10" fill="#1E293B"/>
  <text x="680" y="153" font-family="Consolas, monospace" font-size="14" fill="#718096"># Producer đẩy message</text>
  <text x="680" y="175" font-family="Consolas, monospace" font-size="13" fill="#E2E8F0">RPUSH order:queue</text>
  <text x="700" y="195" font-family="Consolas, monospace" font-size="13" fill="#FF6B35">'{"order_id":1,"product":"Laptop"}'</text>
  <text x="680" y="225" font-family="Consolas, monospace" font-size="14" fill="#718096"># Consumer lấy message</text>
  <text x="680" y="247" font-family="Consolas, monospace" font-size="14" fill="#E2E8F0">LPOP order:queue</text>
  <text x="680" y="269" font-family="Consolas, monospace" font-size="13" fill="#2E7D32">'{"order_id":1,"product":"Laptop"}'</text>

  <!-- Diagram -->
  <rect x="660" y="330" width="560" height="120" rx="10" fill="#E5F4F9"/>
  <text x="700" y="375" font-family="Arial, sans-serif" font-size="16" fill="#2D3748">LPUSH →</text>
  <rect x="790" y="355" width="60" height="35" rx="6" fill="#D12B1F" fill-opacity="0.15"/><text x="820" y="378" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#D12B1F">T1</text>
  <rect x="860" y="355" width="60" height="35" rx="6" fill="#0B4DA2" fill-opacity="0.15"/><text x="890" y="378" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#0B4DA2">T2</text>
  <rect x="930" y="355" width="60" height="35" rx="6" fill="#006AF9" fill-opacity="0.15"/><text x="960" y="378" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#006AF9">T3</text>
  <rect x="1000" y="355" width="60" height="35" rx="6" fill="#2E7D32" fill-opacity="0.15"/><text x="1030" y="378" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#2E7D32">T4</text>
  <text x="1080" y="378" font-family="Arial, sans-serif" font-size="16" fill="#2D3748">→ RPUSH</text>
  <text x="700" y="430" font-family="Arial, sans-serif" font-size="14" fill="#718096">LPOP ← lấy từ đầu (FIFO)  |  RPOP → lấy từ cuối (LIFO)</text>

  <rect x="60" y="480" width="1160" height="50" rx="10" fill="#006AF9" fill-opacity="0.05"/>
  <text x="90" y="512" font-family="Consolas, monospace" font-size="15" fill="#2D3748">LPUSH / RPUSH key val  |  LPOP / RPOP key  |  LRANGE key start stop  |  LLEN key</text>

  <text x="1220" y="700" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#A0AEC0">20 / 25</text>
</svg>