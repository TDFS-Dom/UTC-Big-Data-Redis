<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs><filter id="shadow" x="-15%" y="-15%" width="140%" height="140%"><feGaussianBlur in="SourceAlpha" stdDeviation="10"/><feOffset dx="0" dy="4" result="offsetBlur"/><feFlood flood-color="#000000" flood-opacity="0.12" result="shadowColor"/><feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadow"/><feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <rect width="1280" height="720" fill="#FFFFFF"/><rect x="0" y="0" width="1280" height="6" fill="#0B4DA2"/>
  <text x="60" y="55" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#0B4DA2">So sánh ACID vs BASE</text>
  <rect x="60" y="68" width="60" height="3" rx="1.5" fill="#D12B1F"/>

  <!-- ACID Column -->
  <g filter="url(#shadow)"><rect x="60" y="100" width="560" height="530" rx="12" fill="#FFFFFF"/>
  <rect x="60" y="100" width="560" height="55" rx="12" fill="#0B4DA2"/><rect x="60" y="143" width="560" height="12" fill="#0B4DA2"/>
  <text x="340" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF">ACID (RDBMS)</text></g>
  <rect x="90" y="175" width="500" height="55" rx="8" fill="#E5F4F9"/>
  <text x="340" y="208" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#2D3748">Consistency ngay lập tức</text>
  <rect x="90" y="245" width="500" height="55" rx="8" fill="#F5F7FA"/>
  <text x="340" y="278" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#2D3748">Ưu tiên tính đúng đắn</text>
  <rect x="90" y="315" width="500" height="55" rx="8" fill="#E5F4F9"/>
  <text x="340" y="348" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#2D3748">Bi quan (Pessimistic)</text>
  <rect x="90" y="385" width="500" height="55" rx="8" fill="#F5F7FA"/>
  <text x="340" y="418" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#2D3748">Phức tạp, cứng nhắc</text>
  <rect x="90" y="455" width="500" height="55" rx="8" fill="#E5F4F9"/>
  <text x="340" y="488" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#2D3748">Mở rộng dọc (Vertical Scaling)</text>
  <rect x="90" y="540" width="500" height="55" rx="8" fill="#0B4DA2" fill-opacity="0.08"/>
  <text x="340" y="573" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#0B4DA2">MySQL, PostgreSQL, Oracle</text>

  <!-- BASE Column -->
  <g filter="url(#shadow)"><rect x="660" y="100" width="560" height="530" rx="12" fill="#FFFFFF"/>
  <rect x="660" y="100" width="560" height="55" rx="12" fill="#D12B1F"/><rect x="660" y="143" width="560" height="12" fill="#D12B1F"/>
  <text x="940" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#FFFFFF">BASE (NoSQL / Redis)</text></g>
  <rect x="690" y="175" width="500" height="55" rx="8" fill="#D12B1F" fill-opacity="0.06"/>
  <text x="940" y="208" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#2D3748">Eventual Consistency</text>
  <rect x="690" y="245" width="500" height="55" rx="8" fill="#F5F7FA"/>
  <text x="940" y="278" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#2D3748">Ưu tiên tính khả dụng</text>
  <rect x="690" y="315" width="500" height="55" rx="8" fill="#D12B1F" fill-opacity="0.06"/>
  <text x="940" y="348" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#2D3748">Lạc quan (Optimistic)</text>
  <rect x="690" y="385" width="500" height="55" rx="8" fill="#F5F7FA"/>
  <text x="940" y="418" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#2D3748">Đơn giản, linh hoạt</text>
  <rect x="690" y="455" width="500" height="55" rx="8" fill="#D12B1F" fill-opacity="0.06"/>
  <text x="940" y="488" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#2D3748">Mở rộng ngang (Horizontal Scaling)</text>
  <rect x="690" y="540" width="500" height="55" rx="8" fill="#D12B1F" fill-opacity="0.1"/>
  <text x="940" y="573" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#D12B1F">Redis, MongoDB, Cassandra</text>

  <!-- VS divider -->
  <circle cx="640" cy="380" r="28" fill="#FF6B35"/><text x="640" y="388" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#FFFFFF">VS</text>

  <text x="1220" y="700" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#A0AEC0">10 / 25</text>
</svg>