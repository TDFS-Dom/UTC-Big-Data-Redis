<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <filter id="shadow" x="-15%" y="-15%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/><feOffset dx="0" dy="4" result="offsetBlur"/>
      <feFlood flood-color="#000000" flood-opacity="0.12" result="shadowColor"/>
      <feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1280" height="6" fill="#0B4DA2"/>
  <text x="60" y="55" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#0B4DA2">3.3 Định lý CAP (CAP Theorem)</text>
  <rect x="60" y="68" width="60" height="3" rx="1.5" fill="#D12B1F"/>
  <text x="60" y="95" font-family="Arial, sans-serif" font-size="16" fill="#718096">Do Eric Brewer đề xuất — Một hệ phân tán chỉ đạt được 2 trong 3 tính chất</text>

  <!-- Venn Diagram 3 vòng tròn -->
  <!-- C -->
  <circle cx="400" cy="310" r="160" fill="#0B4DA2" fill-opacity="0.12" stroke="#0B4DA2" stroke-width="2.5" stroke-opacity="0.5"/>
  <text x="400" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#0B4DA2">Consistency</text>
  <text x="400" y="233" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#718096">Tính nhất quán</text>

  <!-- A -->
  <circle cx="300" cy="480" r="160" fill="#2E7D32" fill-opacity="0.12" stroke="#2E7D32" stroke-width="2.5" stroke-opacity="0.5"/>
  <text x="210" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2E7D32">Availability</text>
  <text x="210" y="583" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#718096">Tính khả dụng</text>

  <!-- P -->
  <circle cx="500" cy="480" r="160" fill="#D12B1F" fill-opacity="0.12" stroke="#D12B1F" stroke-width="2.5" stroke-opacity="0.5"/>
  <text x="590" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#D12B1F">Partition</text>
  <text x="590" y="583" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#718096">Chịu lỗi phân vùng</text>

  <!-- Intersection labels -->
  <text x="340" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#0B4DA2">CA</text>
  <text x="340" y="388" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#718096">RDBMS</text>

  <rect x="430" y="345" width="60" height="50" rx="8" fill="#D12B1F" fill-opacity="0.15" stroke="#D12B1F" stroke-width="1.5"/>
  <text x="460" y="370" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#D12B1F">CP</text>
  <text x="460" y="388" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#D12B1F">Redis</text>

  <text x="400" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#2E7D32">AP</text>
  <text x="400" y="488" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#718096">Cassandra</text>

  <!-- Bảng bên phải -->
  <g filter="url(#shadow)">
    <rect x="700" y="120" width="520" height="480" rx="12" fill="#FFFFFF"/>
  </g>
  <!-- Header -->
  <rect x="700" y="120" width="520" height="45" rx="12" fill="#0B4DA2"/>
  <rect x="700" y="153" width="520" height="12" fill="#0B4DA2"/>
  <text x="770" y="150" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">Loại</text>
  <text x="870" y="150" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">Tính chất</text>
  <text x="1060" y="150" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">Ví dụ</text>

  <!-- CA row -->
  <rect x="720" y="185" width="60" height="30" rx="6" fill="#0B4DA2" fill-opacity="0.1"/>
  <text x="750" y="205" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#0B4DA2">CA</text>
  <text x="870" y="205" font-family="Arial, sans-serif" font-size="15" fill="#2D3748">Consistency + Availability</text>
  <text x="1060" y="205" font-family="Arial, sans-serif" font-size="14" fill="#718096">MySQL, PostgreSQL</text>

  <!-- CP row - highlighted -->
  <rect x="710" y="235" width="500" height="80" rx="8" fill="#D12B1F" fill-opacity="0.06" stroke="#D12B1F" stroke-width="1.5" stroke-opacity="0.3"/>
  <rect x="720" y="255" width="60" height="30" rx="6" fill="#D12B1F" fill-opacity="0.15"/>
  <text x="750" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#D12B1F">CP</text>
  <text x="870" y="268" font-family="Arial, sans-serif" font-size="15" fill="#2D3748">Consistency + Partition Tol.</text>
  <text x="1060" y="268" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#D12B1F">Redis, HBase,</text>
  <text x="1060" y="290" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#D12B1F">MongoDB, BigTable</text>

  <!-- AP row -->
  <rect x="720" y="340" width="60" height="30" rx="6" fill="#2E7D32" fill-opacity="0.1"/>
  <text x="750" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#2E7D32">AP</text>
  <text x="870" y="360" font-family="Arial, sans-serif" font-size="15" fill="#2D3748">Availability + Partition Tol.</text>
  <text x="1060" y="360" font-family="Arial, sans-serif" font-size="14" fill="#718096">Cassandra, DynamoDB</text>

  <!-- Redis box -->
  <rect x="720" y="410" width="480" height="70" rx="10" fill="#E5F4F9"/>
  <use data-icon="chunk/database" x="740" y="425" width="36" height="36" fill="#D12B1F"/>
  <text x="790" y="440" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#D12B1F">Redis thuộc nhóm CP</text>
  <text x="790" y="462" font-family="Arial, sans-serif" font-size="14" fill="#718096">Ưu tiên nhất quán, chấp nhận giảm khả dụng khi network partition</text>

  <!-- Kết luận -->
  <rect x="720" y="500" width="480" height="80" rx="10" fill="#F5F7FA"/>
  <text x="740" y="530" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#0B4DA2">Quy tắc quan trọng:</text>
  <text x="740" y="558" font-family="Arial, sans-serif" font-size="14" fill="#2D3748">Không có hệ phân tán nào đạt cả 3 tính chất cùng lúc.</text>
  <text x="740" y="575" font-family="Arial, sans-serif" font-size="14" fill="#2D3748">Phải chọn hy sinh 1 trong 3: C, A, hoặc P.</text>

  <text x="1220" y="700" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#A0AEC0">05 / 25</text>
</svg>