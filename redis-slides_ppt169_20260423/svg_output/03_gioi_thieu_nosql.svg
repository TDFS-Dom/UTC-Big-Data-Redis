<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <filter id="shadow" x="-15%" y="-15%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dx="0" dy="4" result="offsetBlur"/>
      <feFlood flood-color="#000000" flood-opacity="0.12" result="shadowColor"/>
      <feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1280" height="6" fill="#0B4DA2"/>

  <!-- Tiêu đề -->
  <text x="60" y="55" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#0B4DA2">3.1 Giới thiệu NoSQL</text>
  <rect x="60" y="68" width="60" height="3" rx="1.5" fill="#D12B1F"/>

  <!-- Trung tâm: Redis -->
  <circle cx="350" cy="370" r="90" fill="#D12B1F" fill-opacity="0.1" stroke="#D12B1F" stroke-width="2"/>
  <use data-icon="chunk/database" x="326" y="330" width="48" height="48" fill="#D12B1F"/>
  <text x="350" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#D12B1F">Redis</text>
  <text x="350" y="432" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#718096">Key-Value Store</text>

  <!-- Nhánh 1: NoSQL -->
  <line x1="260" y1="320" x2="130" y2="200" stroke="#0B4DA2" stroke-width="2" stroke-opacity="0.4"/>
  <circle cx="130" cy="200" r="50" fill="#0B4DA2" fill-opacity="0.08" stroke="#0B4DA2" stroke-width="1.5"/>
  <text x="130" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0B4DA2">NoSQL</text>
  <text x="130" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#718096">Not Only SQL</text>

  <!-- Nhánh 2: In-Memory -->
  <line x1="280" y1="400" x2="120" y2="490" stroke="#006AF9" stroke-width="2" stroke-opacity="0.4"/>
  <circle cx="120" cy="490" r="50" fill="#006AF9" fill-opacity="0.08" stroke="#006AF9" stroke-width="1.5"/>
  <text x="120" y="485" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#006AF9">In-Memory</text>
  <text x="120" y="505" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#718096">Lưu trên RAM</text>

  <!-- Nhánh 3: Schemaless -->
  <line x1="350" y1="280" x2="350" y2="160" stroke="#2E7D32" stroke-width="2" stroke-opacity="0.4"/>
  <circle cx="350" cy="140" r="50" fill="#2E7D32" fill-opacity="0.08" stroke="#2E7D32" stroke-width="1.5"/>
  <text x="350" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2E7D32">Schemaless</text>
  <text x="350" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#718096">Không schema</text>

  <!-- Nhánh 4: CP -->
  <line x1="440" y1="330" x2="560" y2="220" stroke="#D12B1F" stroke-width="2" stroke-opacity="0.4"/>
  <circle cx="560" cy="200" r="50" fill="#D12B1F" fill-opacity="0.08" stroke="#D12B1F" stroke-width="1.5"/>
  <text x="560" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#D12B1F">CP</text>
  <text x="560" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#718096">CAP Theorem</text>

  <!-- Nhánh 5: Horizontal Scale -->
  <line x1="430" y1="410" x2="560" y2="500" stroke="#FF6B35" stroke-width="2" stroke-opacity="0.4"/>
  <circle cx="560" cy="500" r="50" fill="#FF6B35" fill-opacity="0.08" stroke="#FF6B35" stroke-width="1.5"/>
  <text x="560" y="495" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#FF6B35">Horizontal</text>
  <text x="560" y="515" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#718096">Mở rộng ngang</text>

  <!-- Bảng 4 loại NoSQL bên phải -->
  <g filter="url(#shadow)">
    <rect x="680" y="100" width="540" height="520" rx="12" fill="#FFFFFF"/>
    <rect x="680" y="100" width="540" height="50" rx="12" fill="#0B4DA2"/>
    <rect x="680" y="138" width="540" height="12" fill="#0B4DA2"/>
    <text x="950" y="133" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF">4 Loại NoSQL Database</text>

    <!-- Row 1 -->
    <rect x="700" y="170" width="500" height="100" rx="8" fill="#E5F4F9"/>
    <use data-icon="chunk/key" x="720" y="195" width="36" height="36" fill="#D12B1F"/>
    <text x="770" y="205" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#D12B1F">Key-Value Store</text>
    <text x="770" y="228" font-family="Arial, sans-serif" font-size="14" fill="#2D3748">Redis, DynamoDB, Riak, Memcached</text>
    <text x="770" y="250" font-family="Arial, sans-serif" font-size="13" fill="#718096">Đơn giản nhất, tốc độ cao, cache &amp; session</text>

    <!-- Row 2 -->
    <rect x="700" y="280" width="500" height="100" rx="8" fill="#F5F7FA"/>
    <use data-icon="chunk/table" x="720" y="305" width="36" height="36" fill="#0B4DA2"/>
    <text x="770" y="315" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#0B4DA2">Column-Store</text>
    <text x="770" y="338" font-family="Arial, sans-serif" font-size="14" fill="#2D3748">Cassandra, HBase</text>
    <text x="770" y="360" font-family="Arial, sans-serif" font-size="13" fill="#718096">Lưu theo cột, phù hợp OLAP</text>

    <!-- Row 3 -->
    <rect x="700" y="390" width="500" height="100" rx="8" fill="#E5F4F9"/>
    <use data-icon="chunk/code" x="720" y="415" width="36" height="36" fill="#006AF9"/>
    <text x="770" y="425" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#006AF9">Document DB</text>
    <text x="770" y="448" font-family="Arial, sans-serif" font-size="14" fill="#2D3748">MongoDB, CouchDB</text>
    <text x="770" y="470" font-family="Arial, sans-serif" font-size="13" fill="#718096">Lưu JSON/XML, truy vấn linh hoạt</text>

    <!-- Row 4 -->
    <rect x="700" y="500" width="500" height="100" rx="8" fill="#F5F7FA"/>
    <use data-icon="chunk/globe" x="720" y="525" width="36" height="36" fill="#2E7D32"/>
    <text x="770" y="535" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2E7D32">Graph DB</text>
    <text x="770" y="558" font-family="Arial, sans-serif" font-size="14" fill="#2D3748">Neo4J, InfiniteGraph</text>
    <text x="770" y="580" font-family="Arial, sans-serif" font-size="13" fill="#718096">Node &amp; Edge, mạng xã hội</text>
  </g>

  <text x="1220" y="700" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#A0AEC0">03 / 25</text>
</svg>