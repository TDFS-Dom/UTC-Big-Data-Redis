<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs><filter id="shadow" x="-15%" y="-15%" width="140%" height="140%"><feGaussianBlur in="SourceAlpha" stdDeviation="10"/><feOffset dx="0" dy="4" result="offsetBlur"/><feFlood flood-color="#000000" flood-opacity="0.12" result="shadowColor"/><feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadow"/><feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <rect width="1280" height="720" fill="#FFFFFF"/><rect x="0" y="0" width="1280" height="6" fill="#D12B1F"/>
  <text x="60" y="55" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#D12B1F">Tổng kết các lệnh Redis quan trọng</text>
  <rect x="60" y="68" width="60" height="3" rx="1.5" fill="#0B4DA2"/>

  <g filter="url(#shadow)"><rect x="60" y="90" width="1160" height="560" rx="12" fill="#FFFFFF"/></g>
  <!-- Header -->
  <rect x="60" y="90" width="1160" height="45" rx="12" fill="#0B4DA2"/><rect x="60" y="123" width="1160" height="12" fill="#0B4DA2"/>
  <text x="160" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF">Nhóm</text>
  <text x="480" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF">Lệnh</text>
  <text x="900" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF">Chức năng</text>

  <!-- Rows -->
  <rect x="80" y="145" width="160" height="48" rx="6" fill="#D12B1F" fill-opacity="0.08"/><text x="160" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#D12B1F">String</text>
  <text x="480" y="175" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#2D3748">SET, GET, INCR, DECR, MSET, MGET</text>
  <text x="900" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#718096">Lưu/đọc chuỗi và số</text>

  <rect x="80" y="200" width="160" height="48" rx="6" fill="#0B4DA2" fill-opacity="0.08"/><text x="160" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0B4DA2">Hash</text>
  <text x="480" y="230" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#2D3748">HSET, HGET, HGETALL, HDEL, HINCRBY</text>
  <text x="900" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#718096">Lưu/đọc object</text>

  <rect x="80" y="255" width="160" height="48" rx="6" fill="#006AF9" fill-opacity="0.08"/><text x="160" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#006AF9">List</text>
  <text x="480" y="285" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#2D3748">LPUSH, RPUSH, LPOP, RPOP, LRANGE</text>
  <text x="900" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#718096">Danh sách / Queue</text>

  <rect x="80" y="310" width="160" height="48" rx="6" fill="#2E7D32" fill-opacity="0.08"/><text x="160" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2E7D32">Set</text>
  <text x="480" y="340" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#2D3748">SADD, SMEMBERS, SINTER, SUNION, SDIFF</text>
  <text x="900" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#718096">Tập hợp</text>

  <rect x="80" y="365" width="160" height="48" rx="6" fill="#FF6B35" fill-opacity="0.08"/><text x="160" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#FF6B35">Sorted Set</text>
  <text x="480" y="395" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#2D3748">ZADD, ZREVRANGE, ZRANK, ZCOUNT</text>
  <text x="900" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#718096">Ranking</text>

  <rect x="80" y="420" width="160" height="48" rx="6" fill="#E5F4F9"/><text x="160" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0B4DA2">Key</text>
  <text x="480" y="450" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#2D3748">DEL, EXISTS, EXPIRE, TTL, TYPE, KEYS</text>
  <text x="900" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#718096">Quản lý key</text>

  <rect x="80" y="475" width="160" height="48" rx="6" fill="#F5F7FA"/><text x="160" y="505" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#006AF9">Pub/Sub</text>
  <text x="480" y="505" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#2D3748">SUBSCRIBE, PUBLISH, UNSUBSCRIBE</text>
  <text x="900" y="505" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#718096">Messaging</text>

  <rect x="80" y="530" width="160" height="48" rx="6" fill="#E5F4F9"/><text x="160" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#D12B1F">Transaction</text>
  <text x="480" y="560" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#2D3748">MULTI, EXEC, DISCARD, WATCH</text>
  <text x="900" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#718096">Giao dịch</text>

  <rect x="80" y="585" width="160" height="48" rx="6" fill="#F5F7FA"/><text x="160" y="615" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#0B4DA2">Server</text>
  <text x="480" y="615" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#2D3748">PING, INFO, DBSIZE, FLUSHDB</text>
  <text x="900" y="615" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#718096">Quản lý server</text>

  <text x="1220" y="700" text-anchor="end" font-family="Arial, sans-serif" font-size="12" fill="#A0AEC0">24 / 25</text>
</svg>